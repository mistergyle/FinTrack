<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2f5bea">
<title>Finanzübersicht</title>
<link rel="icon" href="static/icon.png">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card login-card">
    <h1>Finanzübersicht</h1>
    <p class="muted">Selbst gehostet · deine Daten bleiben bei dir.</p>
    <label>Passwort
      <input type="password" id="login-pw" autocomplete="current-password" autofocus required>
    </label>
    <button class="btn primary" type="submit">Anmelden</button>
    <p id="login-err" class="err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <button id="burger" class="burger" type="button" aria-label="Menü öffnen" aria-controls="nav" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="brand"><span class="brand-name">Finanzübersicht</span><span id="page-title" class="page-title"></span></div>
    <nav id="nav" aria-label="Hauptmenü">
      <div class="nav-head">Menü</div>
      <a href="#/uebersicht" data-r="uebersicht"><i>◔</i>Übersicht</a>
      <a href="#/umsaetze" data-r="umsaetze"><i>☰</i>Umsätze</a>
      <a href="#/budgets" data-r="budgets"><i>◎</i>Budgets</a>
      <a href="#/fixkosten" data-r="fixkosten"><i>↻</i>Fixkosten</a>
      <a href="#/konten" data-r="konten"><i>▣</i>Konten</a>
      <a href="#/regeln" data-r="regeln"><i>⚙</i>Regeln</a>
      <button id="logout2" class="btn ghost nav-logout" type="button">Abmelden</button>
    </nav>
    <button id="logout" class="btn ghost">Abmelden</button>
    <img class="app-icon" src="static/icon.png" alt="" width="32" height="32">
  </header>
  <div id="scrim" class="scrim"></div>
  <main id="view" class="wrap" aria-live="polite"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status"></div>
<script src="static/app.js"></script>
</body>
</html>
